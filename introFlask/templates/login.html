<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
  </head>
  <body class="min-h-screen flex items-center justify-center bg-base-200 p-4">
    <div class="card w-full max-w-sm bg-base-100 shadow-xl p-6">
      <h2 class="text-2xl font-bold text-center mb-4">Login</h2>
      <form
        class="form-control gap-3"
        method="POST"
        action="{{ url_for('login') }}"
      >
        <label class="label pb-0" for="username">
          <span class="label-text font-semibold">Username:</span>
        </label>
        <input
          class="input input-bordered w-full"
          type="text"
          id="username"
          name="username"
          required
        />

        <label class="label pb-0" for="password">
          <span class="label-text font-semibold">Password:</span>
        </label>
        <input
          class="input input-bordered w-full"
          type="password"
          id="password"
          name="password"
          required
        />

        <button class="btn btn-primary mt-4" type="submit">Login</button>
      </form>

      <div class="text-center mt-4">
        <a class="link link-primary text-sm" href="{{ url_for('register') }}"
          >¿No tienes una cuenta? Regístrate</a
        >
      </div>
    </div>
  </body>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</html>
